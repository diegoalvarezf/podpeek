name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Tests del lector de AirPods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/PodPeek.Core.Tests

  script:
    name: Versión script (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin errores de sintaxis y la parte nativa compila
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\script\podpeek.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Add-Type -TypeDefinition ([IO.File]::ReadAllText("$pwd\script\PodPeekNative.cs"))
          [PodPeekNative.Win]::Build
          $winmd = Join-Path $env:WINDIR 'System32\WinMetadata'
          $refs = @((Join-Path $winmd 'Windows.Devices.winmd'), (Join-Path $winmd 'Windows.Foundation.winmd'), (Join-Path $winmd 'Windows.Storage.winmd'),
                    ([System.WindowsRuntimeSystemExtensions].Assembly.Location),
                    (Join-Path ([Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory()) 'System.Runtime.dll'))
          Add-Type -TypeDefinition ([IO.File]::ReadAllText("$pwd\script\PodPeekBle.cs")) -ReferencedAssemblies $refs
          try { [PodPeekNative.Ble]::Start(-72) } catch { Write-Host "sin Bluetooth en el runner (normal): $($_.Exception.Message)" }
          [PodPeekNative.Ble]::Drain().Count
          Write-Host "Escáner Bluetooth compila"
          # La ventana (XAML) se carga sin errores
          Add-Type -AssemblyName PresentationFramework
          $src = [IO.File]::ReadAllText("$pwd\script\podpeek.ps1")
          $start = $src.IndexOf("[xml]`$xaml = @'") + 15
          $end = $src.IndexOf("'@", $start)
          [xml]$xaml = $src.Substring($start, $end - $start).Trim()
          $win = [Windows.Markup.XamlReader]::Load((New-Object System.Xml.XmlNodeReader $xaml))
          if (-not $win.FindName('ArcL')) { throw 'falta ArcL' }
          Write-Host "XAML OK"

  build:
    name: PodPeek.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publicar un único .exe con .NET dentro
        run: dotnet publish src/PodPeek/PodPeek.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PodPeek
          path: out/PodPeek.exe
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/PodPeek.exe --title "PodPeek ${{ github.ref_name }}" --generate-notes
