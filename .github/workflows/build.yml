name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Tests del lector de AirPods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/PodPeek.Core.Tests

  script:
    name: Versión script (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis, partes en C# y ventana
        shell: powershell
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\script\podpeek.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e | ForEach-Object { Write-Error $_ }; exit 1 }
          Add-Type -TypeDefinition ([IO.File]::ReadAllText("$pwd\script\PodPeekNative.cs"))
          $w = [PodPeekNative.BleScanner]::Start(-72)   # sin Bluetooth en el runner queda en Aborted, pero se crea
          if ([PodPeekNative.BleScanner]::LastError) { throw [PodPeekNative.BleScanner]::LastError }
          Write-Host "escáner: $([PodPeekNative.BleScanner]::Status($w))"
      - name: Arranca 15 s sin errores
        shell: powershell
        run: |
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$pwd\script\podpeek.ps1" -PassThru
          Start-Sleep 15
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $log = Get-Content "$env:LOCALAPPDATA\PodPeek\podpeek-script.log" -Encoding UTF8
          $log | ForEach-Object { Write-Host $_ }
          if (-not $alive) { throw 'el script se ha cerrado solo' }
          if ($log -match 'error') { throw 'hay errores en el registro' }

  build:
    name: PodPeek.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publicar un único .exe con .NET dentro
        run: dotnet publish src/PodPeek/PodPeek.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PodPeek
          path: out/PodPeek.exe
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/PodPeek.exe --title "PodPeek ${{ github.ref_name }}" --generate-notes
